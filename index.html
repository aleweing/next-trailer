<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Front Row — Next Trailer</title>
  <meta name="description" content="Tráilers de cartelera actual y próximos estrenos, películas y series." />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main>
    <header class="topbar">
      <h1>Front Row</h1>
    </header>

    <nav class="segmented" id="segmented"></nav>

    <div id="content" class="grid"></div>
  </main>

<nav class="bottom-nav" id="bottom-nav">
  <button class="nav-item active" data-media="movies">
    <span class="nav-icon">🎬</span>
    <span>Películas</span>
  </button>
  <button class="nav-item" data-media="series">
    <span class="nav-icon">📺</span>
    <span>Series</span>
  </button>
  <button class="nav-item" data-media="streaming">
    <span class="nav-icon">📡</span>
    <span>Streaming</span>
  </button>
  <button class="nav-item" data-media="watchlist">
    <span class="nav-icon">⭐</span>
    <span>Mi lista</span>
  </button>
</nav>

  <div class="sheet-overlay" id="reminder-sheet">
    <div class="sheet" role="dialog" aria-labelledby="reminder-heading">
      <h2 id="reminder-heading">⏰ Avísame del estreno</h2>
      <p class="sheet-item"><strong id="reminder-title"></strong> · <span id="reminder-date"></span></p>
      <p class="sheet-hint">Se crea una cuenta atrás en <strong>Next Appointment</strong>, donde puedes activar el aviso para el día del estreno.</p>
      <a class="sheet-btn primary" id="reminder-open" href="#" target="_blank" rel="noopener">Abrir en Next Appointment</a>
      <button class="sheet-btn" id="reminder-copy">Copiar enlace</button>
      <p class="sheet-hint">¿La tienes instalada en el iPhone? Copia el enlace y pégalo en «Importar» dentro de la app.</p>
      <button class="sheet-btn ghost" id="reminder-close">Cancelar</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <div class="player-overlay" id="player-overlay">
    <button class="player-close" id="player-close">Cerrar</button>
    <div class="player-wrap">
      <iframe
        id="player-frame"
        src=""
        title="Tráiler"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
